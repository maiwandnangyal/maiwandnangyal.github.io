name: Update attention chart

on:
  schedule:
    - cron: "23 6 3,10 * *"   # the 3rd and 10th of each month at 06:23 UTC (the 10th is a second try)
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Wikipedia views and news coverage, rebuild attention.json
        run: python .github/scripts/update_attention.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- attention; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attention
          git commit -m "Update attention data ($(date -u +%F))"
          git push
          # Pushes made by this workflow do not always start a Pages rebuild, so request one
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
