name: Update inflation chart

on:
  schedule:
    - cron: "37 8 * * *"     # every day at 08:37 UTC
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the latest prices and rebuild inflation.json
        run: python .github/scripts/update_inflation.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- inflation; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inflation
          git commit -m "Update inflation data ($(date -u +%F))"
          # if another update workflow pushed in the meantime, take its commit and try again
          git push || (git pull --rebase && git push)
          # Pushes made by this workflow do not always start a Pages rebuild, so request one
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
