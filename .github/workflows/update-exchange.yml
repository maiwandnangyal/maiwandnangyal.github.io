name: Update exchange rate chart

on:
  schedule:
    - cron: "23 7 * * *"     # every day at 07:23 UTC
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest rates and rebuild exchange.json
        run: python .github/scripts/update_exchange.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- exchange; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exchange
          git commit -m "Update exchange rate data ($(date -u +%F))"
          git push
          # Pushes made by this workflow do not always start a Pages rebuild, so request one
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
