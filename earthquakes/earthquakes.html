<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earthquakes across the frontier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="earthquakes.css?v=20261031105550">
</head>
<body>
<figure class="viz-root" data-v="20261031105550">
  <figcaption>
    <h2>Earthquakes across the frontier</h2>
    <p class="subtitle">Every earthquake on record by year: Afghanistan, Khyber Pakhtunkhwa, former FATA and Balochistan.</p>
  </figcaption>
  <div class="bar">
    <div class="tabs" role="tablist" aria-label="Magnitude">
      <button role="tab" data-m="40" aria-selected="true">Magnitude 4 and above</button>
      <button role="tab" data-m="50" aria-selected="false">Magnitude 5 and above</button>
    </div>
    <div class="year">
      <button class="play" aria-label="Play through the years">&#9654;</button>
      <input type="range" aria-label="Year">
      <output class="yr"></output>
    </div>
  </div>
  <div class="stats"></div>
  <div class="grid2">
    <div>
      <div class="legend map-legend"></div>
      <div class="map" role="img" aria-label="Map of earthquakes in the selected year, by district"></div>
      <label class="ghost"><input type="checkbox" checked> Show earlier years in grey</label>
    </div>
    <div>
      <div class="legend bar-legend"></div>
      <div class="bars" role="img" aria-label="Bar chart of earthquakes per year inside the four regions, shallow and deep"></div>
      <p class="note">Earthquakes per year inside the four regions. Click the chart to choose a year.</p>
    </div>
  </div>
  <div class="tooltip" hidden></div>
  <details>
    <summary>Show the strongest earthquakes on record</summary>
    <div class="table-wrap"></div>
  </details>
  <p class="source"></p>
</figure>
<script src="d3.v7.9.0.min.js"></script>
<script src="earthquakes.js?v=20261031105550"></script>
</body>
</html>
